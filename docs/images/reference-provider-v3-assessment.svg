<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="figure-title figure-description">
<title id="figure-title">Fresh sealed V3 reference-provider assessment</title>
<desc id="figure-description">The exact frozen rank-8 provider passes ordinary fidelity on sixteen fresh probes, but passes none of eight eligible radial contrasts, reverses the one eligible signed contrast, and hallucinates changes on five of twelve teacher-invariant null contrasts. The formal panel is inconclusive because the signed family lacks sufficient eligible coverage; the provider does not pass.</desc>
