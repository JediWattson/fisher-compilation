<title id="figure-title">Gemma L3-to-L4 rank diagnostic</title>
<desc id="figure-description">Two panels compare ranks 64 and 128. Reconstruction and the in-sample local JVP residual improve at rank 128, while finite oracle-backed local pair-control cosine, relative error, and logical parameter cost all move in the wrong direction. Values are means across four prompt-local controls.</desc>
