<text class="section-label" x="76.0" y="770.0">WHY THE NEXT TEST IS OBJECTIVE REBALANCING</text>
<text class="footer-strong" x="76.0" y="800.0">Pointwise loss is &gt;99.995% of the final weighted objective at every rank (contrast terms: 0.951 / 0.425 / 0.507).</text>
<text class="footer" x="76.0" y="829.0">Exact chart correction is active: fit JVPs use z(hmid) and Jz(hmid)(hR−hL), not endpoint subtraction; chord error reached 72.6%.</text>
<text class="footer" x="50.0" y="888.0">Boundary: open synthetic development only — no natural-prompt, NLL, whole-model replacement/compression, realized kernel, speed, or latency claim.</text>
<text class="footer" x="50.0" y="919.0">C1 failed closed at h≤2 with fit and selection unopened; fresh C2 identities selected h=8 without changing gates.</text>
