<title id="figure-title">Contrast-aware packed reference-provider development</title>
<desc id="figure-description">Three panels compare rank 8, 16, and 32 dense modal-packing providers by stored scalars and ideal mathematical MACs, held-out ordinary fidelity, and null, radial, and signed contrast passes. All ordinary and null tests pass, but no candidate passes the combined sensitivity gates.</desc>
