[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fisher-graph"
version = "0.1.0"
description = "Instrumentable activation-Fisher analysis and modal graph compilation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
mlx = [
  "mlx>=0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
gemma = [
  "transformers>=4.55.2,<6",
  "sentencepiece>=0.2",
]

[project.scripts]
fisher-graph-experiment = "fisher_graph.associative_experiment:main"
fisher-graph-conditional-rank = "fisher_graph.associative_conditional_rank_experiment:main"
