[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fisher-graph"
version = "0.1.0"
description = "Instrumentable activation-Fisher analysis and modal graph compilation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
mlx = [
  "mlx>=0.32; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
gemma = [
  "transformers>=4.55.2,<6",
  "sentencepiece>=0.2",
]

[project.scripts]
fisher-graph-experiment = "fisher_graph.associative_experiment:main"
fisher-graph-conditional-rank = "fisher_graph.associative_conditional_rank_experiment:main"
fisher-graph-variable-associative-train = "fisher_graph.variable_associative_training:main"
fisher-graph-variable-conditional = "fisher_graph.variable_conditional_experiment:main"
fisher-graph-variable-full-span = "fisher_graph.variable_full_span_experiment:main"
fisher-graph-variable-static-full-span = "fisher_graph.variable_static_full_span_experiment:main"
fisher-graph-variable-static-full-span-v2 = "fisher_graph.variable_static_full_span_v2_experiment:main"
fisher-graph-intervene = "fisher_graph.intervention_experiment:main"
fisher-graph-modal-executor = "fisher_graph.modal_executor_experiment:main"
fisher-graph-modal-completion = "fisher_graph.modal_completion_experiment:main"
fisher-graph-modal-compose = "fisher_graph.modal_composition_experiment:main"
fisher-graph-fuse = "fisher_graph.fused_executor_experiment:main"
fisher-graph-benchmark-mlx = "fisher_graph.mlx_benchmark:main"
fisher-graph-gemma-fisher = "fisher_graph.gemma3_experiment:main"
fisher-graph-gemma-stability = "fisher_graph.gemma3_stability_experiment:main"
fisher-graph-gemma-trajectory = "fisher_graph.gemma3_trajectory_experiment:main"
fisher-graph-gemma-ablation = "fisher_graph.gemma3_ablation_experiment:main"
fisher-graph-gemma-weighted-jacobian = "fisher_graph.gemma3_weighted_jacobian_experiment:main"
fisher-graph-gemma-gated-executor = "fisher_graph.gemma3_gated_executor_experiment:main"
fisher-graph-gemma-projection-ladder = "fisher_graph.gemma3_projection_ladder_experiment:main"
fisher-graph-gemma-codimension-rotation = "fisher_graph.gemma3_codimension_rotation_experiment:main"
fisher-graph-gemma-rotated-span-executor = "fisher_graph.gemma3_rotated_span_executor_experiment:main"
fisher-graph-gemma-merged-supermodes = "fisher_graph.gemma3_merged_supermode_experiment:main"
fisher-graph-gemma-full-width-layer = "fisher_graph.gemma3_full_width_single_layer_experiment:main"
fisher-graph-gemma-structured-layer = "fisher_graph.gemma3_structured_single_layer_experiment:main"
fisher-graph-gemma-structured-mlp-build = "fisher_graph.gemma3_structured_mlp_compression_a_experiment:main"
fisher-graph-gemma-structured-mlp-heldout = "fisher_graph.gemma3_structured_mlp_compression_heldout_experiment:main"
fisher-graph-gemma-dense-supermode-dev = "fisher_graph.gemma3_structured_mlp_dense_supermode_dev_experiment:main"
fisher-graph-gemma-full-model-merge-dev = "fisher_graph.gemma3_full_model_merge_dev_experiment:main"
fisher-graph-gemma-modal-generator-dev = "fisher_graph.gemma3_modal_generator_dev_experiment:main"
fisher-graph-gemma-modal-generator-multifragment-dev = "fisher_graph.gemma3_modal_generator_multifragment_dev_experiment:main"
fisher-graph-plot-optimizations = "fisher_graph.optimization_figure:main"
fisher-graph-verify = "fisher_graph.verify:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
